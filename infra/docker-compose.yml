services:
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: sleep-apnea-backend
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: sleep-apnea-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
